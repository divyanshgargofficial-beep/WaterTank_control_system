version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: water_tank_controller
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/water_tank_controller?schema=public
    depends_on:
      - db

volumes:
  postgres_data:
